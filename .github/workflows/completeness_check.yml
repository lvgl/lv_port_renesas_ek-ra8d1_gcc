name: Validate README and Links

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Validate README sections
        run: |
          if ! grep -q "## Overview" README.md || \
             ! grep -q "## Benchmark" README.md || \
             ! grep -q "## Specification" README.md || \
             ! grep -q "## Getting started" README.md; then
            echo "README.md is missing one or more required sections." && exit 1;
          fi

      - name: Check if https://lvgl.io/boards has a link to this repo
        run: |
          REPO_URL=$(git config --get remote.origin.url | sed 's/\.git$//')
          curl -s https://lvgl.io/boards | grep -q "$REPO_URL"
          if [ $? -ne 0 ]; then
            echo "https://lvgl.io/boards does not have a link to this repository." && exit 1;
          fi

      - name: Check if https://github.com/lvgl/lvgl_project_creator/blob/master/manifests has a link to this repo
        run: |
          REPO_URL=$(git config --get remote.origin.url | sed 's/.*\/\/[^\/]*\/\([^\/]*\/[^\/]*\).*/\1/')
          curl -s https://raw.githubusercontent.com/lvgl/lvgl_project_creator/master/manifests | grep -q "$REPO_URL"
          if [ $? -ne 0 ]; then
            echo "Manifest does not contain a link to this repository." && exit 1;
          fi

      # This port takes LVGL from the FSP LVGL pack, so neither LVGL config file is
      # committed and this check enforces that.
      #
      # lv_conf.h is generated by the Smart Configurator from configuration.xml and the
      # src/lv_conf_user.h overlay, and rewritten on every "Generate Project Content".
      # A committed copy would only be a snapshot that can silently disagree with
      # configuration.xml, and a hand-written one would shadow the generated header
      # because the project root is on the include path.
      #
      # lv_conf.defaults is read only by lvgl/lvgl's scripts/release_branch_updater.py,
      # which on finding one regenerates lv_conf.h from LVGL's template and pushes the
      # result. That would overwrite the generated header and drop its
      # `#include "lv_conf_user.h"`, so every setting in the overlay would stop applying.
      # It needs both files to do that, so committing neither keeps it inert.
      #
      # Configure LVGL in the FSP Smart Configurator, or in src/lv_conf_user.h.
      - name: Check lv_conf files
        run: |
          echo "Checking that no LVGL config files are committed..."

          LV_CONF_H_COUNT=$(find . -type f -name "lv_conf.h" | wc -l)
          LV_CONF_DEFAULT_COUNT=$(find . -type f -name "lv_conf.defaults" | wc -l)

          echo "Found $LV_CONF_H_COUNT lv_conf.h file(s)."
          echo "Found $LV_CONF_DEFAULT_COUNT lv_conf.defaults file(s)."

          if [ "$LV_CONF_H_COUNT" -ne 0 ]; then
            echo "❌ lv_conf.h must not be committed: it is generated by the FSP Smart"
            echo "   Configurator, so a checked-in copy goes stale, and one outside"
            echo "   ra_cfg/ would shadow the generated header."
            exit 1
          fi

          if [ "$LV_CONF_DEFAULT_COUNT" -ne 0 ]; then
            echo "❌ lv_conf.defaults must not be committed: it makes lvgl/lvgl's"
            echo "   release_branch_updater.py overwrite the generated lv_conf.h and drop"
            echo "   the src/lv_conf_user.h include."
            exit 1
          fi

          echo "✅ File checks passed."

      - name: Check if the repo URL is in the branch updater
        run: |
          FILE_URL="https://raw.githubusercontent.com/lvgl/lvgl/master/scripts/release_branch_updater_port_urls.txt"
          REPO_URL_TO_CHECK="https://github.com/${{ github.repository }}"

          echo "Checking if $REPO_URL_TO_CHECK exists in $FILE_URL..."

          # Download the file and check for the URL
          if curl -s $FILE_URL | grep -Fxq "$REPO_URL_TO_CHECK"; then
            echo "✅ The repository URL is listed"
          else
            echo "❌ The repository URL is NOT"
            exit 1
          fi

      - name: Check for YouTube link in README
        run: |
          if ! grep -qE 'https://(www\.)?youtube\.com|youtu\.be' README.md; then
            echo "README.md is missing a link to a YouTube video." && exit 1;
          fi

